ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: false
    publish_tf: false
    map_frame: bluerov/map
    odom_frame: bluerov/odom
    base_link_frame: bluerov/base_link
    world_frame: bluerov/map

    pose0: sensors/pressure/pose_ned
    pose0_config: [false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 3

    pose1: sensors/aruco/pose_ned
    pose1_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose1_differential: false
    pose1_relative: false
    pose1_queue_size: 1
    # ArUco is an absolute position update. A 2-sigma gate rejects valid
    # corrections when the observer has accumulated drift while out of view.
    pose1_rejection_threshold: 2.0

    pose2: sensors/aruco/pose_ned
    pose2_config: [false, false, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose2_differential: false
    pose2_relative: false
    pose2_queue_size: 1
    # Same gate for the yaw measurement coming from the same ArUco estimate.
    pose2_rejection_threshold: 2.0

    imu0: sensors/imu
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 5
    imu0_remove_gravitational_acceleration: false

    imu1: sensors/imu
    imu1_config: [false, false, false,
                  false,  false,  true,
                  false, false, false,
                  false,  false, false,
                  false, false, false]
    imu1_differential: true
    imu1_relative: false
    imu1_queue_size: 5
    imu1_remove_gravitational_acceleration: false

    odom0: /bluerov/simple_observer/predicted_odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: true
    odom0_relative: false
    odom0_queue_size: 3
