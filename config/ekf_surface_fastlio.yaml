navsat_transform_node:
  ros__parameters:
    frequency: 10.0
    delay: 0.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: true
    wait_for_datum: true
    broadcast_utm_transform: false
    broadcast_utm_transform_as_parent_frame: false

gps_anchor_node:
  ros__parameters:
    world_frame: world_enu
    origin_mode: manual
    origin_latitude: 39.9699390
    origin_longitude: 0.0139927
    origin_altitude: 0.0
    anchor_sample_count: 30
    max_horizontal_accuracy_m: 20.0
    log_invalid_fixes: false
    yaw_offset_rad: 0.0
    publish_path: true
    max_path_size: 1000
