ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: blueboat/map
    odom_frame: blueboat/odom
    base_link_frame: blueboat/base_link_enu
    world_frame: blueboat/map

    odom0: /blueboat/fastlio/odometry
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

